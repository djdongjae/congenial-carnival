<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계획/실적관리</title>
    
    <!-- CSS와 JS는 JavaScript에서 동적으로 로드됩니다 -->
    
</head>
<body>
    <div class="container">
        <div class="content">
            <!-- 상단 컨트롤 영역 -->
            <div class="control-panel" style="margin-bottom: 20px; padding: 15px; background: #f5f5f5; border-radius: 5px;">
                <div style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap;">
                    <!-- 년/월 선택 -->
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <button id="prevYearBtn" style="padding: 5px 10px; cursor: pointer;">◀</button>
                        <span id="yearDisplay" style="font-weight: bold; min-width: 50px; text-align: center;">2025</span>
                        <button id="nextYearBtn" style="padding: 5px 10px; cursor: pointer;">▶</button>
                        <div id="monthTabs" style="display: flex; gap: 5px; margin-left: 10px;">
                            <!-- 월 탭은 JavaScript에서 동적으로 생성 -->
                        </div>
                    </div>
                    
                    <!-- 검색 필터 -->
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <select id="socialWorkerFilter" style="padding: 5px;">
                            <option value="">전체</option>
                        </select>
                        <input type="text" id="lifeSupportWorkerSearch" placeholder="생활지원사 이름" style="padding: 5px; width: 150px;">
                        <button id="searchBtn" style="padding: 5px 15px; cursor: pointer;">검색</button>
                    </div>
                    
                    <!-- 기능 버튼 -->
                    <button id="excelRegisterBtn" style="padding: 5px 15px; cursor: pointer; margin-left: auto;">일정엑셀등록</button>
                </div>
            </div>
            
            <!-- 그리드 컨테이너 -->
            <div class="grid-container">
                <table id="MainGrid"></table>
                <div id="MainPager"></div>
            </div>
        </div>
    </div>

    <!-- 동적 리소스 로딩 -->
    <script>
        // CSS와 JS 파일을 동적으로 로드하는 함수
        function loadResources() {
            const commonScript = document.createElement('script');
            commonScript.src = '../../js/common.js?_t='+(new Date().toISOString().replace(/[-:T]/g, '').substring(0, 14));
            commonScript.onload = async function() {
                try {
                    // 공통 리소스 로드
                    const success = await loadCommonResources();
                    if (success) {
                        // 공통 그리드 스크립트 로드
                        await loadJS('../../js/commonGrid.js');
                        // Plan Performance Schedule 페이지 전용 스크립트 로드
                        await loadJS('../../js/pages/plan-performance/plan-performance-schedule.js');
                        
                        // initMainGrid 함수가 정의될 때까지 대기 후 초기화
                        let attempts = 0;
                        const maxAttempts = 50; // 5초 대기
                        const checkInitMainGrid = setInterval(() => {
                            attempts++;
                            if (typeof initMainGrid === 'function') {
                                clearInterval(checkInitMainGrid);
                                initMainGrid();
                            } else if (attempts >= maxAttempts) {
                                clearInterval(checkInitMainGrid);
                                console.error('initMainGrid 함수를 찾을 수 없습니다');
                            }
                        }, 100);
                    }
                } catch (error) {
                    console.error('리소스 로드 중 오류 발생:', error);
                }
            };
            commonScript.onerror = function() {
                console.error('common.js 로드 실패');
            };
            document.head.appendChild(commonScript);
        }
        
        // DOM 로드 완료 후 리소스 로드
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadResources);
        } else {
            loadResources();
        }
    </script>
</body>
</html>
