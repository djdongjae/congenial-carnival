<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>앨범</title>
    
    <!-- CSS와 JS는 JavaScript에서 동적으로 로드됩니다 -->
    
</head>
<body>
    <div class="container">
        <div class="content">
            <!-- 헤더 섹션 -->
            <div class="page-header">
                <h1><i class="fas fa-images"></i> 앨범</h1>
                <p>행사 및 활동 사진을 관리합니다</p>
            </div>

            <!-- 통계 카드 섹션 -->
            <div class="stats-section">
                <div class="stat-card stat-primary">
                    <div class="stat-icon">
                        <i class="fas fa-folder"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="total-albums">0</h3>
                        <p>전체 앨범</p>
                    </div>
                </div>
                <div class="stat-card stat-success">
                    <div class="stat-icon">
                        <i class="fas fa-image"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="total-photos">0</h3>
                        <p>전체 사진</p>
                    </div>
                </div>
                <div class="stat-card stat-warning">
                    <div class="stat-icon">
                        <i class="fas fa-calendar-day"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="today-photos">0</h3>
                        <p>오늘 업로드</p>
                    </div>
                </div>
                <div class="stat-card stat-info">
                    <div class="stat-icon">
                        <i class="fas fa-hdd"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="total-size">0</h3>
                        <p>총 용량 (MB)</p>
                    </div>
                </div>
            </div>

            <!-- 검색 및 필터 섹션 -->
            <div class="search-section">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-input" placeholder="앨범명으로 검색..." />
                    <button class="btn-search" onclick="searchAlbums()">
                        <i class="fas fa-search"></i> 검색
                    </button>
                    <button class="btn-reset" onclick="resetSearch()">
                        <i class="fas fa-redo"></i> 초기화
                    </button>
                </div>
                <div class="filter-section">
                    <select id="date-filter" class="filter-select" onchange="filterAlbums()">
                        <option value="">전체 기간</option>
                        <option value="today">오늘</option>
                        <option value="week">이번 주</option>
                        <option value="month">이번 달</option>
                        <option value="year">올해</option>
                    </select>
                </div>
            </div>

            <!-- 액션 버튼 섹션 -->
            <div class="action-section">
                <button class="btn-action btn-primary" onclick="createAlbum()">
                    <i class="fas fa-plus"></i> 앨범 만들기
                </button>
                <button class="btn-action btn-success" onclick="uploadPhotos()">
                    <i class="fas fa-upload"></i> 사진 업로드
                </button>
                <button class="btn-action btn-info" onclick="refreshAlbums()">
                    <i class="fas fa-sync-alt"></i> 새로고침
                </button>
            </div>

            <!-- 앨범 목록 섹션 -->
            <div class="albums-section">
                <div class="section-header">
                    <h2><i class="fas fa-images"></i> 앨범 목록</h2>
                    <span class="result-count" id="result-count">총 0개</span>
                </div>
                <div class="albums-grid" id="albums-grid">
                    <!-- 동적으로 로드되는 앨범 목록 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 앨범 생성 모달 -->
    <div class="modal" id="album-modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">앨범 만들기</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="album-form">
                    <div class="form-group">
                        <label>앨범명 <span class="required">*</span></label>
                        <input type="text" id="album-name" required />
                    </div>
                    <div class="form-group">
                        <label>설명</label>
                        <textarea id="album-description" rows="4"></textarea>
                    </div>
                    <div class="form-group">
                        <label>날짜</label>
                        <input type="date" id="album-date" />
                    </div>
                    <div class="form-group">
                        <label>태그</label>
                        <input type="text" id="album-tags" placeholder="쉼표로 구분하여 입력 (예: 행사, 복지관, 모임)" />
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-modal btn-secondary" onclick="closeModal()">취소</button>
                <button class="btn-modal btn-primary" onclick="saveAlbum()">저장</button>
            </div>
        </div>
    </div>

    <!-- 사진 업로드 모달 -->
    <div class="modal" id="upload-modal" style="display: none;">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3>사진 업로드</h3>
                <button class="modal-close" onclick="closeUploadModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>앨범 선택 <span class="required">*</span></label>
                    <select id="upload-album" required>
                        <option value="">앨범을 선택하세요</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>사진 선택 <span class="required">*</span></label>
                    <input type="file" id="upload-photos" multiple accept="image/*" />
                    <div class="upload-preview" id="upload-preview"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-modal btn-secondary" onclick="closeUploadModal()">취소</button>
                <button class="btn-modal btn-primary" onclick="doUpload()">업로드</button>
            </div>
        </div>
    </div>

    <!-- 동적 리소스 로딩 -->
    <script>
        function loadResources() {
            const commonScript = document.createElement('script');
            commonScript.src = '../../js/common.js?_t='+(new Date().toISOString().replace(/[-:T]/g, '').substring(0, 14));
            commonScript.onload = async function() {
                try {
                    const success = await loadCommonResources();
                    if (success) {
                        await loadJS('../../js/pages/post-management/album.js');
                    }
                } catch (error) {
                    console.error('리소스 로드 중 오류 발생:', error);
                }
            };
            commonScript.onerror = function() {
                console.error('common.js 로드 실패');
            };
            document.head.appendChild(commonScript);
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadResources);
        } else {
            loadResources();
        }
    </script>
</body>
</html>
