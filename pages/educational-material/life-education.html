<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생활교육</title>
    
    <!-- CSS와 JS는 JavaScript에서 동적으로 로드됩니다 -->
    
</head>
<body>
    <div class="container">
        <div class="content">
            <!-- 헤더 섹션 -->
            <div class="page-header">
                <h1><i class="fas fa-book"></i> 생활교육</h1>
                <p>생활교육 자료를 관리하고 학습자를 위한 콘텐츠를 제공합니다</p>
            </div>

            <!-- 통계 카드 섹션 -->
            <div class="stats-section">
                <div class="stat-card stat-primary">
                    <div class="stat-icon">
                        <i class="fas fa-book"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="total-materials">0</h3>
                        <p>전체 자료</p>
                    </div>
                </div>
                <div class="stat-card stat-success">
                    <div class="stat-icon">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="total-learners">0</h3>
                        <p>전체 학습자</p>
                    </div>
                </div>
                <div class="stat-card stat-warning">
                    <div class="stat-icon">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="completed-learners">0</h3>
                        <p>완료한 학습자</p>
                    </div>
                </div>
                <div class="stat-card stat-info">
                    <div class="stat-icon">
                        <i class="fas fa-eye"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="total-views">0</h3>
                        <p>전체 조회수</p>
                    </div>
                </div>
            </div>

            <!-- 검색 및 필터 섹션 -->
            <div class="search-section">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-input" placeholder="제목, 내용으로 검색..." />
                    <button class="btn-search" onclick="searchMaterials()">
                        <i class="fas fa-search"></i> 검색
                    </button>
                    <button class="btn-reset" onclick="resetSearch()">
                        <i class="fas fa-redo"></i> 초기화
                    </button>
                </div>
                <div class="filter-section">
                    <select id="category-filter" class="filter-select" onchange="filterMaterials()">
                        <option value="">전체 카테고리</option>
                        <option value="health">건강</option>
                        <option value="safety">안전</option>
                        <option value="daily">일상생활</option>
                        <option value="finance">금융</option>
                        <option value="digital">디지털</option>
                        <option value="other">기타</option>
                    </select>
                    <select id="level-filter" class="filter-select" onchange="filterMaterials()">
                        <option value="">전체 난이도</option>
                        <option value="beginner">초급</option>
                        <option value="intermediate">중급</option>
                        <option value="advanced">고급</option>
                    </select>
                </div>
            </div>

            <!-- 액션 버튼 섹션 -->
            <div class="action-section">
                <button class="btn-action btn-primary" onclick="addMaterial()">
                    <i class="fas fa-plus"></i> 자료 등록
                </button>
                <button class="btn-action btn-success" onclick="uploadMaterial()">
                    <i class="fas fa-upload"></i> 파일 업로드
                </button>
                <button class="btn-action btn-info" onclick="refreshMaterials()">
                    <i class="fas fa-sync-alt"></i> 새로고침
                </button>
            </div>

            <!-- 교육 자료 목록 섹션 -->
            <div class="materials-section">
                <div class="section-header">
                    <h2><i class="fas fa-list"></i> 교육 자료 목록</h2>
                    <span class="result-count" id="result-count">총 0개</span>
                </div>
                <div class="materials-list" id="materials-list">
                    <!-- 동적으로 로드되는 교육 자료 목록 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 교육 자료 등록/수정 모달 -->
    <div class="modal" id="material-modal" style="display: none;">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3 id="modal-title">교육 자료 등록</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="material-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label>카테고리 <span class="required">*</span></label>
                            <select id="material-category" required>
                                <option value="health">건강</option>
                                <option value="safety">안전</option>
                                <option value="daily">일상생활</option>
                                <option value="finance">금융</option>
                                <option value="digital">디지털</option>
                                <option value="other">기타</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>난이도 <span class="required">*</span></label>
                            <select id="material-level" required>
                                <option value="beginner">초급</option>
                                <option value="intermediate">중급</option>
                                <option value="advanced">고급</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>제목 <span class="required">*</span></label>
                        <input type="text" id="material-title" required />
                    </div>
                    <div class="form-group">
                        <label>설명</label>
                        <textarea id="material-description" rows="4"></textarea>
                    </div>
                    <div class="form-group">
                        <label>내용 <span class="required">*</span></label>
                        <textarea id="material-content" rows="10" required></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>학습 시간 (분)</label>
                            <input type="number" id="material-duration" min="1" value="30" />
                        </div>
                        <div class="form-group">
                            <label>상태</label>
                            <select id="material-status">
                                <option value="active">활성</option>
                                <option value="inactive">비활성</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>첨부 파일</label>
                        <input type="file" id="material-file" accept=".pdf,.doc,.docx,.ppt,.pptx,.jpg,.png" />
                        <small>PDF, 문서, 이미지 파일을 업로드할 수 있습니다.</small>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-modal btn-secondary" onclick="closeModal()">취소</button>
                <button class="btn-modal btn-primary" onclick="saveMaterial()">저장</button>
            </div>
        </div>
    </div>

    <!-- 동적 리소스 로딩 -->
    <script>
        function loadResources() {
            const commonScript = document.createElement('script');
            commonScript.src = '../../js/common.js?_t='+(new Date().toISOString().replace(/[-:T]/g, '').substring(0, 14));
            commonScript.onload = async function() {
                try {
                    const success = await loadCommonResources();
                    if (success) {
                        await loadJS('../../js/pages/educational-material/life-education.js');
                    }
                } catch (error) {
                    console.error('리소스 로드 중 오류 발생:', error);
                }
            };
            commonScript.onerror = function() {
                console.error('common.js 로드 실패');
            };
            document.head.appendChild(commonScript);
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadResources);
        } else {
            loadResources();
        }
    </script>
</body>
</html>
