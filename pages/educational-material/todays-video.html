<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘영상</title>
    
    <!-- CSS와 JS는 JavaScript에서 동적으로 로드됩니다 -->
    
</head>
<body>
    <div class="container">
        <div class="content">
            <!-- 헤더 섹션 -->
            <div class="page-header">
                <h1><i class="fas fa-video"></i> 오늘영상</h1>
                <p>매일 제공되는 교육 영상을 관리합니다</p>
            </div>

            <!-- 통계 카드 섹션 -->
            <div class="stats-section">
                <div class="stat-card stat-primary">
                    <div class="stat-icon">
                        <i class="fas fa-video"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="total-videos">0</h3>
                        <p>전체 영상</p>
                    </div>
                </div>
                <div class="stat-card stat-success">
                    <div class="stat-icon">
                        <i class="fas fa-calendar-check"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="today-video">0</h3>
                        <p>오늘 영상</p>
                    </div>
                </div>
                <div class="stat-card stat-warning">
                    <div class="stat-icon">
                        <i class="fas fa-eye"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="total-views">0</h3>
                        <p>전체 조회수</p>
                    </div>
                </div>
                <div class="stat-card stat-info">
                    <div class="stat-icon">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="total-duration">0</h3>
                        <p>총 재생시간 (분)</p>
                    </div>
                </div>
            </div>

            <!-- 검색 및 필터 섹션 -->
            <div class="search-section">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-input" placeholder="제목으로 검색..." />
                    <button class="btn-search" onclick="searchVideos()">
                        <i class="fas fa-search"></i> 검색
                    </button>
                    <button class="btn-reset" onclick="resetSearch()">
                        <i class="fas fa-redo"></i> 초기화
                    </button>
                </div>
                <div class="filter-section">
                    <input type="date" id="date-filter" class="filter-select" onchange="filterVideos()" />
                    <select id="category-filter" class="filter-select" onchange="filterVideos()">
                        <option value="">전체 카테고리</option>
                        <option value="health">건강</option>
                        <option value="education">교육</option>
                        <option value="entertainment">오락</option>
                        <option value="news">뉴스</option>
                        <option value="other">기타</option>
                    </select>
                </div>
            </div>

            <!-- 액션 버튼 섹션 -->
            <div class="action-section">
                <button class="btn-action btn-primary" onclick="addVideo()">
                    <i class="fas fa-plus"></i> 영상 등록
                </button>
                <button class="btn-action btn-success" onclick="setTodayVideo()">
                    <i class="fas fa-star"></i> 오늘의 영상 설정
                </button>
                <button class="btn-action btn-info" onclick="refreshVideos()">
                    <i class="fas fa-sync-alt"></i> 새로고침
                </button>
            </div>

            <!-- 영상 목록 섹션 -->
            <div class="videos-section">
                <div class="section-header">
                    <h2><i class="fas fa-list"></i> 영상 목록</h2>
                    <span class="result-count" id="result-count">총 0개</span>
                </div>
                <div class="videos-grid" id="videos-grid">
                    <!-- 동적으로 로드되는 영상 목록 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 영상 등록/수정 모달 -->
    <div class="modal" id="video-modal" style="display: none;">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3 id="modal-title">영상 등록</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="video-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label>카테고리 <span class="required">*</span></label>
                            <select id="video-category" required>
                                <option value="health">건강</option>
                                <option value="education">교육</option>
                                <option value="entertainment">오락</option>
                                <option value="news">뉴스</option>
                                <option value="other">기타</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>재생일 <span class="required">*</span></label>
                            <input type="date" id="video-date" required />
                        </div>
                    </div>
                    <div class="form-group">
                        <label>제목 <span class="required">*</span></label>
                        <input type="text" id="video-title" required />
                    </div>
                    <div class="form-group">
                        <label>설명</label>
                        <textarea id="video-description" rows="3"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>영상 URL <span class="required">*</span></label>
                            <input type="url" id="video-url" placeholder="https://youtube.com/..." required />
                        </div>
                        <div class="form-group">
                            <label>재생 시간 (분)</label>
                            <input type="number" id="video-duration" min="1" value="10" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label>썸네일 이미지 URL</label>
                        <input type="url" id="video-thumbnail" placeholder="https://..." />
                    </div>
                    <div class="form-group">
                        <label>상태</label>
                        <select id="video-status">
                            <option value="active">활성</option>
                            <option value="inactive">비활성</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="video-today" /> 오늘의 영상으로 설정
                        </label>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-modal btn-secondary" onclick="closeModal()">취소</button>
                <button class="btn-modal btn-primary" onclick="saveVideo()">저장</button>
            </div>
        </div>
    </div>

    <!-- 동적 리소스 로딩 -->
    <script>
        function loadResources() {
            const commonScript = document.createElement('script');
            commonScript.src = '../../js/common.js?_t='+(new Date().toISOString().replace(/[-:T]/g, '').substring(0, 14));
            commonScript.onload = async function() {
                try {
                    const success = await loadCommonResources();
                    if (success) {
                        await loadJS('../../js/pages/educational-material/todays-video.js');
                    }
                } catch (error) {
                    console.error('리소스 로드 중 오류 발생:', error);
                }
            };
            commonScript.onerror = function() {
                console.error('common.js 로드 실패');
            };
            document.head.appendChild(commonScript);
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadResources);
        } else {
            loadResources();
        }
    </script>
</body>
</html>
