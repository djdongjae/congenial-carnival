<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>효톡 2.0 - 맞춤케어 관리시스템</title>
    <!-- CSS와 JS는 JavaScript에서 동적으로 로드됩니다 -->
</head>
<body style="display: none;">
    <!-- 상단 헤더 -->
    <header class="header">
        <div class="header-left">
            <button class="menu-toggle" id="menu-toggle" title="메뉴 닫기">📁</button>
            <div class="logo">
                <span class="logo-text">孝 Talk</span>
            </div>
        </div>
        <div class="header-right">
            <div class="user-info">
                <span class="settings-icon">⚙️</span>
                <span class="user-name">실버에듀넷-TEST 임현정</span>
                <span class="dropdown-arrow">▼</span>
            </div>
      
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <div class="main-container">
        <!-- 좌측 사이드바 -->
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <ul class="nav-menu" id="nav-menu">
                    <!-- JSON에서 동적으로 로드되는 메뉴들이 여기에 추가됩니다 -->
                </ul>
            </nav>
        </aside>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <!-- 탭 컨테이너 -->
            <div class="tab-container">
                <div class="tab-header">
                    <div class="tab-nav-left">
                        <button class="tab-hamburger" id="tab-hamburger" title="모든 탭 보기">☰</button>
                        <button class="tab-scroll-btn" id="scroll-left" title="왼쪽으로 스크롤">‹</button>
                    </div>
                    <div class="tabs" id="tabs-container">
                        <!-- 동적으로 생성되는 탭들이 여기에 추가됩니다 -->
                    </div>
                    <div class="tab-nav-right">
                        <button class="tab-scroll-btn" id="scroll-right" title="오른쪽으로 스크롤">›</button>
                        <button class="tab-btn" id="close-all-tabs" title="모든 탭 닫기">×</button>
                    </div>
                </div>
                <div class="tab-content" id="tab-content">
                    <!-- 동적으로 생성되는 iframe들이 여기에 추가됩니다 -->
                </div>
            </div>
        </main>
    </div>

    <script>
        // CSS와 JS 파일을 동적으로 로드하는 함수
        function loadResources() {
            // 이미 common.js가 로드되었거나 로딩 중이면 중복 로딩 방지
            if (window.commonJsLoaded || document.querySelector('script[src*="common.js"]')) {
                return;
            }
            
            // 로딩 중 플래그 설정
            window.commonJsLoaded = true;
            
            const commonScript = document.createElement('script');
             commonScript.src = '../js/common.js?_t='+(new Date().toISOString().replace(/[-:T]/g, '').substring(0, 14));
             commonScript.onload = async function() {
                try {
                    // common.js의 함수들이 정의되었는지 확인
                    if (typeof loadCSS === 'function' && typeof loadJS === 'function') {
                        loadCSS('../css/styles.css');
                        loadJS('../js/script.js');
                    }
                    document.body.style.display = 'block';
                } catch (error) {
                    console.error('리소스 로드 중 오류 발생:', error);
                }
            };
            commonScript.onerror = function() {
                console.error('common.js 로드 실패');
            };
            document.head.appendChild(commonScript);
        }
        
        // DOM 로드 완료 후 리소스 로드 (한 번만 실행)
        if (!window.resourcesLoaded) {
            window.resourcesLoaded = true;
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', loadResources);
            } else {
                loadResources();
            }
        }
    </script>
</body>
</html>
